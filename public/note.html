<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Canvas · ThinkSL8</title>
<script>try{var t=JSON.parse(localStorage.getItem('sl8:theme'));if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  body { overflow: hidden; overscroll-behavior: none; touch-action: manipulation; }
  #board {
    position: fixed; inset: 0; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    background-color: var(--paper);
    --rule: color-mix(in srgb, var(--dot) 70%, transparent);
  }
  #board.bg-dots { background-image: radial-gradient(circle, var(--dot) 1.1px, transparent 1.3px); }
  #board.bg-grid { background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px); }
  #board.bg-lines { background-image: linear-gradient(var(--rule) 1px, transparent 1px); }
  #board.bg-plain { background-image: none; }
  #board canvas { position: absolute; inset: 0; }
  #live { cursor: crosshair; }
  body.tool-select #live { cursor: default; }
  body.tool-hand #live, body.panning #live { cursor: grab; }
  body.tool-text #live { cursor: text; }

  #texts { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
  .tb { position: absolute; pointer-events: none; border-radius: 6px; }
  .tb.selected { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent); }
  .tb.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0%, 40% { background: color-mix(in srgb, var(--ink-yellow) 45%, transparent); } }
  body.tool-text .tb, .tb:focus-within { pointer-events: auto; }
  .tb textarea {
    display: block; width: 100%; min-width: 80px; padding: 4px 6px; margin: 0;
    border: 1px solid transparent; border-radius: 6px; background: transparent;
    color: var(--c); font: 400 var(--fs)/1.35 var(--font-ui);
    resize: none; overflow: hidden; outline: none; user-select: text; -webkit-user-select: text;
  }
  .tb:focus-within textarea { resize: horizontal; }
  body.tool-text .tb textarea:hover { border-color: var(--line); }
  .tb:focus-within textarea { border-color: var(--accent); background: color-mix(in srgb, var(--surface) 85%, transparent); }
  .tb-bar { position: absolute; bottom: 100%; right: 0; display: none; gap: 4px; padding-bottom: 4px; }
  .tb:focus-within .tb-bar { display: flex; }
  .tb-bar button {
    min-width: 32px; height: 28px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface); font-size: 13px; font-weight: 600; touch-action: none;
  }
  .tb-bar .tb-move { cursor: move; }

  .topbar {
    position: fixed; left: 0; right: 0; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 6px;
    padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px;
    pointer-events: none;
  }
  .topbar > * { pointer-events: auto; }
  .topbar .icon-btn { background: var(--surface); box-shadow: var(--shadow); }
  .title-input {
    min-width: 0; flex: 0 1 360px; height: 40px; padding: 0 12px;
    border: 1px solid transparent; border-radius: 8px;
    background: var(--surface); box-shadow: var(--shadow);
    font-family: var(--font-display); font-size: 19px; text-overflow: ellipsis;
  }
  .title-input:focus { border-color: var(--accent); outline: none; }
  .status { margin-left: auto; padding: 4px 10px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); font-size: 13px; color: var(--muted); white-space: nowrap; }
  .status[data-state="error"] { color: var(--danger); }
  .ai-btn { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 10px; border: 0; border-radius: 8px;
    background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 15px; box-shadow: var(--shadow); }
  .ai-btn svg { width: 20px; height: 20px; fill: currentColor; }
  @media (max-width: 480px) { .ai-btn span { display: none; } .ai-btn { padding: 0 10px; } }

  .menu { position: fixed; z-index: 30; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 56px); width: min(320px, calc(100vw - 24px));
    display: grid; gap: 14px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
  .menu b { display: block; font-size: 13px; margin-bottom: 6px; }
  .menu nav { display: grid; border-top: 1px solid var(--line); padding-top: 8px; }
  .menu nav a { padding: 8px 4px; color: var(--text); text-decoration: none; font-weight: 600; }
  .menu nav a:hover { color: var(--accent); }

  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 8px 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
    pointer-events: none;
  }
  .bar {
    pointer-events: auto; display: flex; align-items: center; gap: 2px; max-width: 100%;
    padding: 4px; border: 1px solid var(--line); border-radius: 14px;
    background: var(--surface); box-shadow: var(--shadow);
  }
  @media (max-width: 420px) { .bar .icon-btn { width: 36px; } }
  @media (any-pointer: coarse) { [data-tool="hand"] { display: none; } }
  .sep { width: 1px; height: 24px; margin: 0 4px; background: var(--line); }
  .zoom { width: auto !important; min-width: 52px; padding: 0 6px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .options { gap: 6px; padding: 4px 8px; }
  .swatch {
    width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%; background: transparent;
    display: grid; place-items: center;
  }
  .swatch span { width: 20px; height: 20px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgb(127 127 127 / 0.25); }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
  .size { width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: transparent; display: grid; place-items: center; }
  .size span { border-radius: 50%; background: var(--text); }
  .size[aria-pressed="true"] { background: var(--accent-soft); }
  .size[aria-pressed="true"] span { background: var(--accent); }
  .empty-hint {
    position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%);
    max-width: calc(100% - 48px); text-align: center; color: var(--muted); pointer-events: none;
  }
  .empty-hint b { display: block; font: 400 26px/1.2 var(--font-display); color: var(--text); margin-bottom: 6px; }

  .selbar { position: fixed; z-index: 9; display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); box-shadow: var(--shadow); transform: translate(-50%, -100%); white-space: nowrap; }
  .selbar .btn { min-height: 36px; padding: 0 12px; font-size: 14px; border: 0; }
  .selbar .count { align-self: center; padding: 0 8px 0 6px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* AI panel: a side sheet on wide screens, a bottom sheet on phones */
  .ai { position: fixed; z-index: 20; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 60px); bottom: 12px; width: min(400px, calc(100vw - 24px));
    display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
  @media (max-width: 640px) {
    .ai { left: 0; right: 0; bottom: 0; top: auto; width: auto; height: min(72dvh, 620px); border-radius: 18px 18px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  }
  .ai-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px 16px; border-bottom: 1px solid var(--line); }
  .ai-head div { flex: 1; min-width: 0; display: grid; }
  .ai-head b { font: 400 20px/1.2 var(--font-display); }
  .ai-sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ai-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px; display: grid; align-content: start; gap: 16px; }
  .ai-empty { display: grid; gap: 12px; }
  .ai-empty h3 { margin: 0; font: 400 22px/1.2 var(--font-display); }
  .ai-empty p { margin: 0; color: var(--muted); font-size: 15px; }
  .ai-empty .btn { justify-self: start; }
  .ai-log { margin: 0; padding: 0; list-style: none; display: grid; gap: 16px; }
  .msg-q { justify-self: end; max-width: 88%; padding: 8px 12px; border-radius: 14px 14px 4px 14px; background: var(--accent-soft); white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg-a { display: grid; gap: 8px; }
  .msg-a .text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
  .msg-a .text:empty::before { content: 'Thinking…'; color: var(--muted); }
  .cite { display: inline; padding: 0 3px; margin: 0 1px; border: 0; border-radius: 4px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; vertical-align: 1px; }
  .sources { font-size: 13px; color: var(--muted); }
  .sources summary { cursor: pointer; }
  .sources ol { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 4px; }
  .sources button { padding: 0; border: 0; background: none; color: var(--text); text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .msg-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .msg-actions .btn { min-height: 32px; padding: 0 10px; font-size: 13px; }
  .ai-foot { display: grid; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid var(--line); }
  .ai-foot .seg span { padding: 4px 10px; font-size: 13px; }
  .ai-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .ai-actions .btn { min-height: 34px; padding: 0 12px; font-size: 14px; }
  #ai-form { display: flex; gap: 8px; align-items: flex-end; }
  #ai-q { flex: 1; min-width: 0; min-height: 44px; max-height: 140px; padding: 10px 12px; resize: none; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); line-height: 1.4; }
  #ai-q:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .ai-note { margin: 0; font-size: 12px; color: var(--muted); }

  /* the infinity reveal */
  .reveal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--paper); cursor: pointer; }
  .reveal svg { width: min(56vw, 360px); height: auto; overflow: visible; }
  .reveal path { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; stroke-dasharray: var(--len); stroke-dashoffset: var(--len);
    animation: rv-draw var(--draw) cubic-bezier(.55,.05,.3,1) forwards; }
  .reveal.open { animation: rv-open var(--open) cubic-bezier(.6,0,.2,1) forwards; }
  .reveal.open svg { animation: rv-zoom var(--open) cubic-bezier(.6,0,.2,1) forwards; }
  @keyframes rv-draw { to { stroke-dashoffset: 0; } }
  @keyframes rv-zoom { to { transform: scale(9); opacity: 0; } }
  @keyframes rv-open { to { opacity: 0; visibility: hidden; } }
</style>
</head>
<body class="tool-select">
<div id="board" class="bg-dots">
  <canvas id="base"></canvas>
  <canvas id="live"></canvas>
  <div id="texts"></div>
</div>
<p class="empty-hint" id="hint" hidden><b>A blank, endless page</b>Double-tap anywhere to write. Pick the pen to draw or handwrite.</p>

<header class="topbar">
  <a class="icon-btn" id="back" href="/canvases" aria-label="All canvases" title="All canvases"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></a>
  <input id="title" class="title-input" aria-label="Canvas title" maxlength="200" autocomplete="off">
  <span id="status" class="status" role="status">Loading…</span>
  <button class="ai-btn" id="ai-open" type="button" aria-label="Ask AI" title="Ask AI"><svg viewBox="0 0 24 24"><path d="M11 3c.7 4.4 2.4 6.1 6.8 6.8-4.4.7-6.1 2.4-6.8 6.8-.7-4.4-2.4-6.1-6.8-6.8C8.6 9.1 10.3 7.4 11 3z"/><path d="M18.5 14.5c.35 1.8 1 2.45 2.8 2.8-1.8.35-2.45 1-2.8 2.8-.35-1.8-1-2.45-2.8-2.8 1.8-.35 2.45-1 2.8-2.8z"/></svg><span>Ask AI</span></button>
  <button class="icon-btn" id="menu-open" aria-label="Canvas options" aria-expanded="false" title="Options"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
</header>

<div id="menu" class="menu" hidden>
  <div><b>Theme</b>
    <div class="seg" role="radiogroup" aria-label="Theme">
      <label><input type="radio" name="m-theme" value=""><span>Auto</span></label>
      <label><input type="radio" name="m-theme" value="light"><span>Light</span></label>
      <label><input type="radio" name="m-theme" value="dark"><span>Dark</span></label>
    </div>
  </div>
  <div><b>Background</b>
    <div class="seg" role="radiogroup" aria-label="Canvas background">
      <label><input type="radio" name="m-bg" value="dots"><span>Dots</span></label>
      <label><input type="radio" name="m-bg" value="grid"><span>Grid</span></label>
      <label><input type="radio" name="m-bg" value="lines"><span>Lines</span></label>
      <label><input type="radio" name="m-bg" value="plain"><span>Plain</span></label>
    </div>
  </div>
  <nav><a href="/canvases">All canvases</a><a href="/settings">Settings</a></nav>
</div>

<div id="selbar" class="selbar" hidden>
  <span class="count" id="sel-count"></span>
  <button class="btn" id="sel-ai" type="button">Ask AI</button>
  <button class="btn danger" id="sel-del" type="button">Delete</button>
</div>

<aside id="ai" class="ai" hidden aria-label="Ask AI">
  <header class="ai-head">
    <div><b>Ask AI</b><span class="ai-sub" id="ai-model"></span></div>
    <button class="icon-btn" id="ai-close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </header>
  <div class="ai-body" id="ai-body">
    <div class="ai-empty" id="ai-empty" hidden></div>
    <ol class="ai-log" id="ai-log"></ol>
  </div>
  <footer class="ai-foot" id="ai-foot" hidden>
    <div class="seg" role="radiogroup" aria-label="What AI reads" id="ai-scope">
      <label><input type="radio" name="ai-scope" value="selection"><span>Selection</span></label>
      <label><input type="radio" name="ai-scope" value="canvas"><span>This canvas</span></label>
      <label><input type="radio" name="ai-scope" value="all"><span>All canvases</span></label>
    </div>
    <div class="ai-actions" id="ai-actions" hidden>
      <button class="btn" type="button" data-action="summarize">Summarize</button>
      <button class="btn" type="button" data-action="plan">Make a plan</button>
      <button class="btn" type="button" data-action="develop">Develop</button>
    </div>
    <form id="ai-form">
      <textarea id="ai-q" rows="1" placeholder="Ask about your notes…" aria-label="Your question"></textarea>
      <button class="btn primary" id="ai-send" type="submit">Ask</button>
    </form>
    <p class="ai-note" id="ai-note"></p>
  </footer>
</aside>

<div class="dock">
  <div class="bar options" id="options">
    <div id="swatches" style="display:flex;gap:2px"></div>
    <span class="sep" id="sep-sizes"></span>
    <div id="sizes" style="display:flex;gap:2px"></div>
    <span class="sep" id="sep-finger"></span>
    <button class="icon-btn" id="finger" aria-pressed="false" aria-label="Draw with finger" title="Draw with finger"><svg viewBox="0 0 24 24"><path d="M22 14a8 8 0 0 1-8 8"/><path d="M18 11v-1a2 2 0 0 0-4 0"/><path d="M14 10V9a2 2 0 0 0-4 0v1"/><path d="M10 9.5V4a2 2 0 0 0-4 0v10"/><path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.3l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"/></svg></button>
  </div>
  <nav class="bar" aria-label="Tools">
    <button class="icon-btn" data-tool="select" aria-label="Select (V)" title="Select (V). Double-tap empty space to write."><svg viewBox="0 0 24 24"><path d="M4 3l7 17 2.5-7L21 10.5z"/></svg></button>
    <button class="icon-btn" data-tool="pen" aria-label="Pen (P)" title="Pen (P)"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.4 3.6a2.1 2.1 0 0 1 3 3L7.4 18.6a2 2 0 0 1-.9.5l-2.9.8a.5.5 0 0 1-.6-.6l.8-2.9a2 2 0 0 1 .5-.9z"/></svg></button>
    <button class="icon-btn" data-tool="hl" aria-label="Highlighter (H)" title="Highlighter (H)"><svg viewBox="0 0 24 24"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg></button>
    <button class="icon-btn" data-tool="eraser" aria-label="Eraser (E)" title="Eraser (E)"><svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg></button>
    <button class="icon-btn" data-tool="text" aria-label="Text (T)" title="Text (T)"><svg viewBox="0 0 24 24"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg></button>
    <button class="icon-btn" data-tool="hand" aria-label="Move around (Space)" title="Move around (hold Space)"><svg viewBox="0 0 24 24"><path d="m5 9-3 3 3 3"/><path d="m9 5 3-3 3 3"/><path d="m15 19-3 3-3-3"/><path d="m19 9 3 3-3 3"/><path d="M2 12h20"/><path d="M12 2v20"/></svg></button>
    <span class="sep"></span>
    <button class="icon-btn" id="undo" aria-label="Undo" title="Undo (Ctrl+Z)" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="icon-btn" id="redo" aria-label="Redo" title="Redo (Ctrl+Shift+Z)" disabled><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <span class="sep"></span>
    <button class="icon-btn zoom" id="zoom" title="Reset zoom to 100% (0)">100%</button>
  </nav>
</div>
<div id="toast" class="toast" role="alert" hidden></div>
<script src="/common.js"></script>
<script src="/note.js"></script>
<script src="/ai-panel.js"></script>
</body>
</html>
