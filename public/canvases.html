<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canvases · ThinkSL8</title>
<script>try{var t=JSON.parse(localStorage.getItem('sl8:theme'));if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a2b48">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  .head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin: 32px 0 12px; }
  .head h1 { margin: 0; font: 400 clamp(32px, 6vw, 44px)/1.05 var(--font-display); }
  .head h1 small { font: 500 15px var(--font-ui); color: var(--muted); margin-left: 8px; font-variant-numeric: tabular-nums; }
  .notes { margin: 0; padding: 0; list-style: none; }
  .notes li { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
  .notes a { flex: 1; min-width: 0; display: grid; gap: 2px; padding: 16px 4px; color: var(--text); text-decoration: none; }
  .notes a:hover .t { color: var(--accent); }
  .notes .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 21px/1.25 var(--font-display); }
  .notes .d { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .del { flex: none; color: var(--muted); }
  .del.confirm { width: auto; padding: 0 12px; background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); font-size: 14px; font-weight: 600; }
  .empty { padding: 48px 0; color: var(--muted); max-width: 44ch; }
  .empty b { display: block; font: 400 24px/1.2 var(--font-display); color: var(--text); margin-bottom: 6px; }
  .search { position: relative; margin: 4px 0 8px; }
  .search svg { position: absolute; left: 14px; top: 50%; width: 20px; height: 20px; transform: translateY(-50%); fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }
  .search input { width: 100%; min-height: 48px; padding: 0 14px 0 44px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #found-count { margin: 12px 4px 0; }
  .results .s { font-size: 15px; color: var(--text); overflow-wrap: anywhere; }
  .results mark { background: color-mix(in srgb, var(--ink-yellow) 45%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
</style>
</head>
<body>
<main class="page">
  <header class="page-top">
    <a class="wordmark" href="/">Think<span data-mark></span></a>
    <a class="btn quiet" href="/settings">Settings</a>
  </header>
  <div class="head">
    <h1>Canvases<small id="count"></small></h1>
    <button class="btn primary" id="new" type="button">New canvas</button>
  </div>
  <form class="search" role="search" id="search-form">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search everything you've typed" aria-label="Search your notes" autocomplete="off">
  </form>
  <div id="found" hidden>
    <p class="d" id="found-count"></p>
    <ul class="notes results" id="results"></ul>
  </div>
  <p class="empty" id="loading">Loading…</p>
  <ul class="notes" id="notes"></ul>
  <p class="empty" id="empty" hidden><b>No canvases yet</b>Each canvas is an endless page. Start one and write, draw or type anywhere on it.</p>
</main>
<div id="toast" class="toast" role="alert" hidden></div>
<script src="/common.js"></script>
<script src="/canvases.js"></script>
</body>
</html>
