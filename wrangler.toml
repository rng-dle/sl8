name = "sl8"
main = "src/worker.js"
compatibility_date = "2025-09-01"
routes = [
  { pattern = "thinksl8.com", custom_domain = true },
  { pattern = "sl8.nastaliq.co", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"] # pages and files are served straight from assets; only the API runs code

[[d1_databases]]
binding = "DB"
database_name = "sl8-db"
database_id = "ed289357-d1e9-41e0-a4d5-14a71ef1e4f1"
