name = "sl8"
main = "src/index.js"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2025-09-01"
routes = [
  { pattern = "thinksl8.com", custom_domain = true },
  { pattern = "sl8.nastaliq.co", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/mcp", "/mcp/*", "/authorize", "/oauth/*", "/.well-known/*"] # pages and files are served straight from assets; only the API and the MCP connector run code

[[d1_databases]]
binding = "DB"
database_name = "sl8-db"
database_id = "ed289357-d1e9-41e0-a4d5-14a71ef1e4f1"

[[durable_objects.bindings]]
name = "ROOM" # one live room per open canvas: pings every open copy when it's saved
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"] # SQLite-backed, the kind the Workers Free plan allows (it stores nothing)

[[kv_namespaces]]
binding = "FILES" # uploaded canvas background images
id = "f20ba06a87b646558d008b09b8ac096d"

[[kv_namespaces]]
binding = "OAUTH_KV" # the MCP connector: OAuth clients, grants and tokens
id = "f2c04d060a5345f5b7508e59f67102db"
