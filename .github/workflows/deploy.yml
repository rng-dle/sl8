# Deploys thinksl8.com on every push to main. Needs one repository secret: CLOUDFLARE_API_TOKEN.
# Database migrations are applied separately (see README), so the token needs no D1 access.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check the Cloudflare token is set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add a CLOUDFLARE_API_TOKEN repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - name: Deploy
        run: npx wrangler deploy
      - name: Create the AI key-encryption secret once
        # never overwrites: changing it would disconnect everyone's AI
        run: |
          if npx wrangler secret list --format json | grep -q '"KEY_ENC_SECRET"'; then
            echo "KEY_ENC_SECRET already set"
          else
            openssl rand -base64 48 | tr -d '\n' | npx wrangler secret put KEY_ENC_SECRET
          fi
