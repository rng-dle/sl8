name: Tests

# Runs the server locally (wrangler dev, local D1 and KV, the fake AI/email provider) and the API test suites against it.
# Nothing here talks to production.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Local settings and database
        run: |
          printf 'KEY_ENC_SECRET="local-dev-only-secret-0123456789abcdef"\nTEST_BASE="http://127.0.0.1:8788"\nRESEND_API_KEY="test-resend-key"\nMCP_RESOURCE="http://127.0.0.1:8787/mcp"\n' > .dev.vars
          npx wrangler d1 migrations apply sl8-db --local
      - name: Start the fake provider and the server
        run: |
          node test/fake-provider.mjs > "$RUNNER_TEMP/fake.log" 2>&1 &
          npx wrangler dev --port 8787 --local-upstream 127.0.0.1:8787 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for i in $(seq 1 90); do curl -s -o /dev/null http://127.0.0.1:8787/ && exit 0; sleep 1; done
          echo "server did not start"; tail -n 60 "$RUNNER_TEMP/wrangler.log"; exit 1
      - name: Smoke test
        run: set -o pipefail; bash test/smoke-test.sh 2>&1 | tee -a "$RUNNER_TEMP/tests.log"
      - name: MCP connector test
        run: set -o pipefail; node test/mcp-test.mjs 2>&1 | tee -a "$RUNNER_TEMP/tests.log"
      - name: Bridge test
        run: set -o pipefail; node --experimental-sqlite test/bridge-test.mjs 2>&1 | tee -a "$RUNNER_TEMP/tests.log"
      - name: Bridge wake and layout test
        run: set -o pipefail; node test/bridge-wake-test.mjs 2>&1 | tee -a "$RUNNER_TEMP/tests.log"
      - name: Canvas alerts test
        run: set -o pipefail; node test/hooks-test.mjs 2>&1 | tee -a "$RUNNER_TEMP/tests.log"
      - name: Account, sharing, marketplace and voice tests
        run: |
          set -o pipefail
          rc=0
          for t in account-test share-test share-follow-test market-test voice-test; do node test/$t.mjs 2>&1 | tee -a "$RUNNER_TEMP/tests.log" || rc=1; done
          exit $rc
      # Failures as annotations too, so they can be read from the checks API without downloading the raw log.
      - name: Report failures
        if: failure()
        run: |
          grep -A2 '^FAIL' "$RUNNER_TEMP/tests.log" | head -n 60 | while IFS= read -r l; do echo "::error title=Test::$l"; done || true
          echo "::error title=Test output tail::$(tail -n 30 "$RUNNER_TEMP/tests.log" 2>/dev/null | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          echo "::error title=Server log tail::$(tail -n 40 "$RUNNER_TEMP/wrangler.log" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
